<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Saya</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f5;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.1);
    }

    input[type="file"] {
      width: 100%;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      background: #888;
    }

    progress {
      width: 100%;
      height: 20px;
      margin-top: 20px;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      word-break: break-word;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
    }

    .url {
      margin-top: 10px;
      font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎬 Video Saya</h1>

  <div class="box">

    <h3>Upload Video</h3>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <button id="uploadButton">
      Upload Video
    </button>

    <progress
      id="progress"
      value="0"
      max="100"
    ></progress>

    <div id="status">
      Pilih video terlebih dahulu.
    </div>

    <div id="result"></div>

  </div>

</div>

<script>

const CLOUD_NAME = "t2uovgv8";
const UPLOAD_PRESET = "video_upload";

const CHUNK_SIZE = 10 * 1024 * 1024; // 10 MB

const videoFile = document.getElementById("videoFile");
const uploadButton = document.getElementById("uploadButton");
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const result = document.getElementById("result");


function formatSize(bytes) {

  const mb = bytes / (1024 * 1024);

  if (mb < 1024) {
    return mb.toFixed(1) + " MB";
  }

  return (mb / 1024).toFixed(2) + " GB";
}


function createUploadId() {

  if (crypto.randomUUID) {
    return crypto.randomUUID();
  }

  return "upload-" + Date.now() + "-" +
         Math.random().toString(36).substring(2);
}


async function uploadChunk(
  file,
  start,
  end,
  uploadId
) {

  const chunk = file.slice(start, end);

  const formData = new FormData();

  formData.append("file", chunk);
  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );

  const contentRange =
    `bytes ${start}-${end - 1}/${file.size}`;

  const response = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,
    {
      method: "POST",
      body: formData,

      headers: {
        "X-Unique-Upload-Id": uploadId,
        "Content-Range": contentRange
      }
    }
  );

  const text = await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error(text);
  }

  if (!response.ok) {

    throw new Error(
      data?.error?.message ||
      "Upload gagal."
    );

  }

  return data;
}


async function uploadVideo(file) {

  const uploadId = createUploadId();

  let start = 0;

  let lastResponse = null;

  while (start < file.size) {

    const end = Math.min(
      start + CHUNK_SIZE,
      file.size
    );

    status.textContent =
      `Mengupload ${formatSize(start)} / ${formatSize(file.size)}`;

    lastResponse = await uploadChunk(
      file,
      start,
      end,
      uploadId
    );

    start = end;

    const percent =
      Math.round((start / file.size) * 100);

    progress.value = percent;

    status.textContent =
      `Upload ${percent}%`;

  }

  return lastResponse;
}


uploadButton.addEventListener(
  "click",
  async function() {

    const file = videoFile.files[0];

    if (!file) {

      status.textContent =
        "Pilih video terlebih dahulu.";

      return;
    }

    if (!file.type.startsWith("video/")) {

      status.textContent =
        "File harus berupa video.";

      return;
    }

    uploadButton.disabled = true;

    progress.value = 0;

    result.innerHTML = "";

    status.textContent =
      `Menyiapkan upload ${formatSize(file.size)}...`;

    try {

      const data =
        await uploadVideo(file);

      progress.value = 100;

      status.textContent =
        "✅ Upload berhasil!";

      if (data.secure_url) {

        result.innerHTML = `

          <p><strong>Video berhasil disimpan.</strong></p>

          <video
            controls
            src="${data.secure_url}">
          </video>

          <div class="url">
            <strong>Link video:</strong><br>
            ${data.secure_url}
          </div>

        `;

      }

    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ Upload gagal: " + error.message;

    }

    uploadButton.disabled = false;

  }
);

</script>

</body>
</html>
