<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Website</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f1115;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #181b21;
  padding: 18px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.upload-box {
  background: #181b21;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 25px;
}

input,
textarea,
button {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #101217;
  color: white;
}

textarea {
  min-height: 80px;
}

button {
  background: #22c55e;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.status {
  margin-top: 12px;
}

.search {
  margin-bottom: 20px;
}

.search input {
  font-size: 16px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.video-card {
  background: #181b21;
  border-radius: 14px;
  overflow: hidden;
}

.video-card video {
  width: 100%;
  display: block;
  background: black;
  aspect-ratio: 16 / 9;
}

.thumbnail {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  display: block;
  background: #222;
}

.video-info {
  padding: 15px;
}

.video-info h2 {
  margin: 0 0 8px;
  font-size: 18px;
}

.video-info p {
  color: #aaa;
  margin: 0;
  line-height: 1.5;
}

.play-button {
  background: #22c55e;
  border: none;
  margin-top: 12px;
}

@media (max-width: 600px) {
  .container {
    padding: 12px;
  }

  .video-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎬 Video Website</h1>
</header>

<div class="container">

  <div class="upload-box">
    <h2>📤 Upload Video</h2>

    <input
      type="text"
      id="title"
      placeholder="Judul video"
    >

    <textarea
      id="description"
      placeholder="Deskripsi video"
    ></textarea>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <button id="uploadButton">
      Upload Video
    </button>

    <div class="status" id="status"></div>
  </div>

  <h2>📺 Daftar Video</h2>

  <div class="search">
    <input
      type="text"
      id="searchInput"
      placeholder="🔍 Cari video..."
    >
  </div>

  <div id="videoList">
    Memuat video...
  </div>

</div>

<script>

// ==============================
// SUPABASE
// ==============================

const SUPABASE_URL =
"https://ozyzecibmuxqceuzrgrt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uXyty33hCPRNCC52I84klg_Fdtuy4Pf";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ==============================
// CLOUDINARY
// ==============================

const CLOUD_NAME = "t2uovgv8";

const UPLOAD_PRESET = "video_upload";


// ==============================
// ELEMENT
// ==============================

const uploadButton =
document.getElementById("uploadButton");

const status =
document.getElementById("status");

const searchInput =
document.getElementById("searchInput");

let allVideos = [];


// ==============================
// UPLOAD VIDEO
// ==============================

uploadButton.addEventListener("click", async () => {

  const title =
    document.getElementById("title").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const file =
    document.getElementById("videoFile").files[0];

  if (!title) {
    alert("Masukkan judul video.");
    return;
  }

  if (!file) {
    alert("Pilih video terlebih dahulu.");
    return;
  }

  uploadButton.disabled = true;

  try {

    status.textContent =
      "⏳ Mengupload video...";

    const formData = new FormData();

    formData.append("file", file);

    formData.append(
      "upload_preset",
      UPLOAD_PRESET
    );

    const response =
      await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,
        {
          method: "POST",
          body: formData
        }
      );

    if (!response.ok) {
      throw new Error(
        "Upload Cloudinary gagal."
      );
    }

    const cloudinaryData =
      await response.json();

    const publicId =
      cloudinaryData.public_id;

    status.textContent =
      "⏳ Menyimpan data video...";


    const { error } =
      await supabaseClient
      .from("videos")
      .insert({
        title: title,
        description: description,
        public_id: publicId
      });


    if (error) {
      throw error;
    }


    status.textContent =
      "✅ Video berhasil diupload!";

    document.getElementById("title").value = "";

    document.getElementById("description").value = "";

    document.getElementById("videoFile").value = "";

    loadVideos();

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Terjadi kesalahan: " +
      error.message;

  }

  uploadButton.disabled = false;

});


// ==============================
// LOAD VIDEOS
// ==============================

async function loadVideos() {

  const videoList =
    document.getElementById("videoList");


  const { data, error } =
    await supabaseClient
    .from("videos")
    .select("*")
    .order("created_at", {
      ascending: false
    });


  if (error) {

    videoList.innerHTML =
      "<p>Gagal mengambil video.</p>";

    console.error(error);

    return;
  }


  allVideos = data || [];

  showVideos(allVideos);
}


// ==============================
// SHOW VIDEOS
// ==============================

function showVideos(videos) {

  const videoList =
    document.getElementById("videoList");


  if (!videos.length) {

    videoList.innerHTML =
      "<p>Video tidak ditemukan.</p>";

    return;
  }


  videoList.innerHTML =
    '<div class="video-grid"></div>';

  const grid =
    videoList.querySelector(".video-grid");


  videos.forEach(video => {

    const videoUrl =
      `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/${video.public_id}.mp4`;


    const thumbnailUrl =
      `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/so_0,w_640,h_360,c_fill/${video.public_id}.jpg`;


    const card =
      document.createElement("div");

    card.className =
      "video-card";


    card.innerHTML = `

      <img
        class="thumbnail"
        src="${thumbnailUrl}"
        alt="${escapeHtml(video.title)}"
      >

      <div class="video-info">

        <h2>
          ${escapeHtml(video.title)}
        </h2>

        <p>
          ${escapeHtml(video.description || "")}
        </p>

        <button class="play-button">
          ▶ Putar Video
        </button>

      </div>
    `;


    const playButton =
      card.querySelector(".play-button");


    playButton.addEventListener(
      "click",
      () => {

        const player =
          document.createElement("video");

        player.controls = true;

        player.autoplay = true;

        player.playsInline = true;

        player.src = videoUrl;

        player.style.width = "100%";

        player.style.aspectRatio = "16 / 9";

        player.style.background = "black";


        card.insertBefore(
          player,
          card.querySelector(".video-info")
        );

        playButton.remove();
      }
    );


    grid.appendChild(card);

  });

}


// ==============================
// SEARCH
// ==============================

searchInput.addEventListener(
  "input",
  () => {

    const keyword =
      searchInput.value
      .toLowerCase()
      .trim();


    const filtered =
      allVideos.filter(video => {

        const title =
          (video.title || "")
          .toLowerCase();

        const description =
          (video.description || "")
          .toLowerCase();


        return (
          title.includes(keyword) ||
          description.includes(keyword)
        );

      });


    showVideos(filtered);

  }
);


// ==============================
// SECURITY
// ==============================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


// ==============================
// START
// ==============================

loadVideos();

</script>

</body>
</html>
