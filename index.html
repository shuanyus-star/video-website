<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Saya</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    input {
      width: 100%;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      background: #999;
    }

    #status {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 Video Saya</h1>

    <div class="box">

      <h3>Upload Video</h3>

      <input
        type="file"
        id="video"
        accept="video/*"
      >

      <button id="upload">
        Upload Video
      </button>

      <div id="status"></div>

    </div>

  </div>

  <script>
    const videoInput = document.getElementById("video");
    const uploadButton = document.getElementById("upload");
    const status = document.getElementById("status");

    uploadButton.addEventListener("click", function () {

      if (!videoInput.files.length) {
        status.textContent = "Pilih video terlebih dahulu.";
        return;
      }

      const file = videoInput.files[0];

      status.textContent =
        "Video dipilih: " + file.name;

    });
  </script>

</body>
</html>
