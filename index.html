<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Streaming</title>

  <!-- Cloudinary Video Player -->
  <link
    href="https://unpkg.com/cloudinary-video-player@3.0.2/dist/cld-video-player.min.css"
    rel="stylesheet"
  >

  <script
    src="https://unpkg.com/cloudinary-video-player@3.0.2/dist/cld-video-player.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #181818;
      padding: 18px 20px;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .player-box {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    #video-player {
      width: 100%;
      display: block;
    }

    .video-info {
      padding: 15px 5px 20px;
    }

    .video-info h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .video-info p {
      margin: 0;
      color: #aaa;
      line-height: 1.5;
    }

    .section-title {
      font-size: 20px;
      margin: 25px 0 15px;
    }

    .video-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .video-card {
      background: #181818;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .video-card:hover {
      transform: translateY(-3px);
      background: #222;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .card-content {
      padding: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.4;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 30px;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Video Streaming</h1>
  </header>

  <main class="container">

    <!-- VIDEO PLAYER -->
    <div class="player-box">
      <video
        id="video-player"
        controls
        playsinline
      ></video>
    </div>

    <!-- VIDEO INFO -->
    <div class="video-info">
      <h2 id="video-title">Memuat video...</h2>
      <p id="video-description">
        Silakan tunggu sebentar.
      </p>
    </div>

    <!-- VIDEO LIST -->
    <h2 class="section-title">Video Terbaru</h2>

    <div id="video-list" class="video-list"></div>

  </main>

  <footer>
    © 2026 Video Streaming
  </footer>


  <script>

    // ============================
    // CLOUNDINARY
    // ============================

    const CLOUD_NAME = "t2uovgv8";


    // ============================
    // DAFTAR VIDEO
    // ============================

    const videos = [
      {
        title: "Video Pertama",
        description: "Video streaming dari Cloudinary.",
        publicId: "c06sbdxgbqtrb8dcs7jc"
      }
    ];


    // ============================
    // PLAYER
    // ============================

    const player = cloudinary.videoPlayer(
      "video-player",
      {
        cloud_name: CLOUD_NAME,

        controls: true,

        fluid: true,

        muted: false,

        autoplay: false
      }
    );


    // ============================
    // ELEMENT HTML
    // ============================

    const videoList =
      document.getElementById("video-list");

    const videoTitle =
      document.getElementById("video-title");

    const videoDescription =
      document.getElementById("video-description");


    // ============================
    // MEMBUAT DAFTAR VIDEO
    // ============================

    function createVideoList() {

      videoList.innerHTML = "";

      videos.forEach((video, index) => {

        const card =
          document.createElement("div");

        card.className = "video-card";


        // Thumbnail Cloudinary
        const thumbnail =
          document.createElement("img");

        thumbnail.className = "thumbnail";

        thumbnail.src =
          `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/so_0,w_600,h_338,c_fill/${video.publicId}.jpg`;

        thumbnail.alt =
          video.title;


        // Content
        const content =
          document.createElement("div");

        content.className =
          "card-content";


        const title =
          document.createElement("div");

        title.className =
          "card-title";

        title.textContent =
          video.title;


        content.appendChild(title);

        card.appendChild(thumbnail);

        card.appendChild(content);


        // Ketika video dipilih
        card.addEventListener("click", () => {

          playVideo(video);

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        });


        videoList.appendChild(card);

      });

    }


    // ============================
    // MEMUTAR VIDEO
    // ============================

    function playVideo(video) {

      videoTitle.textContent =
        video.title;

      videoDescription.textContent =
        video.description;


      // Menggunakan HLS
      player.source(
        video.publicId,
        {
          sourceTypes: ["hls"]
        }
      );

    }


    // ============================
    // MULAI
    // ============================

    createVideoList();

    playVideo(videos[0]);

  </script>

</body>
</html>
