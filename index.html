<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Website</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f1115;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #181b21;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.upload-box {
  background: #181b21;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 25px;
}

input,
textarea,
button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #101217;
  color: white;
}

textarea {
  min-height: 80px;
}

button {
  background: #22c55e;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.status {
  margin-top: 12px;
}

.video-card {
  background: #181b21;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 25px;
}

.video-card video {
  width: 100%;
  display: block;
  background: black;
}

.video-info {
  padding: 15px;
}

.video-info h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.video-info p {
  color: #aaa;
  margin: 0;
}
</style>
</head>

<body>

<header>
  <h1>🎬 Video Website</h1>
</header>

<div class="container">

  <div class="upload-box">
    <h2>Upload Video</h2>

    <input
      type="text"
      id="title"
      placeholder="Judul video"
    >

    <textarea
      id="description"
      placeholder="Deskripsi video"
    ></textarea>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <button id="uploadButton">
      Upload Video
    </button>

    <div class="status" id="status"></div>
  </div>

  <h2>📺 Daftar Video</h2>

  <div id="videoList">
    Memuat video...
  </div>

</div>

<script>

// ==============================
// SUPABASE
// ==============================

const SUPABASE_URL = 
  "https://ozyzecibmuxqceuzrgrt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_uXyty33hCPRNCC52I84klg_Fdtuy4Pf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ==============================
// CLOUDINARY
// ==============================

const CLOUD_NAME = "t2uovgv8";

const UPLOAD_PRESET = "video_upload";


// ==============================
// ELEMENT
// ==============================

const uploadButton =
  document.getElementById("uploadButton");

const status =
  document.getElementById("status");


// ==============================
// UPLOAD VIDEO
// ==============================

uploadButton.addEventListener("click", async () => {

  const title =
    document.getElementById("title").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const file =
    document.getElementById("videoFile").files[0];

  if (!title) {
    alert("Masukkan judul video.");
    return;
  }

  if (!file) {
    alert("Pilih video terlebih dahulu.");
    return;
  }

  uploadButton.disabled = true;

  try {

    status.textContent =
      "⏳ Mengupload video ke Cloudinary...";

    // Upload ke Cloudinary
    const formData = new FormData();

    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);

    const cloudinaryResponse =
      await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,
        {
          method: "POST",
          body: formData
        }
      );

    if (!cloudinaryResponse.ok) {
      throw new Error(
        "Upload Cloudinary gagal."
      );
    }

    const cloudinaryData =
      await cloudinaryResponse.json();

    const publicId =
      cloudinaryData.public_id;

    status.textContent =
      "⏳ Menyimpan data video...";

    // Simpan data ke Supabase
    const { error } =
      await supabaseClient
        .from("videos")
        .insert({
          title: title,
          description: description,
          public_id: publicId
        });

    if (error) {
      throw error;
    }

    status.textContent =
      "✅ Video berhasil diupload!";

    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
    document.getElementById("videoFile").value = "";

    loadVideos();

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Terjadi kesalahan: " +
      error.message;

  }

  uploadButton.disabled = false;

});


// ==============================
// LOAD VIDEOS
// ==============================

async function loadVideos() {

  const videoList =
    document.getElementById("videoList");

  const { data, error } =
    await supabaseClient
      .from("videos")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    videoList.innerHTML =
      "<p>Gagal mengambil video.</p>";

    console.error(error);

    return;
  }

  if (!data || data.length === 0) {

    videoList.innerHTML =
      "<p>Belum ada video.</p>";

    return;
  }

  videoList.innerHTML = "";

  data.forEach(video => {

    const videoUrl =
      `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/${video.public_id}.mp4`;

    const card =
      document.createElement("div");

    card.className = "video-card";

    card.innerHTML = `

      <video
        controls
        preload="metadata"
        playsinline
        src="${videoUrl}">
      </video>

      <div class="video-info">

        <h2>${escapeHtml(video.title)}</h2>

        <p>
          ${escapeHtml(video.description || "")}
        </p>

      </div>
    `;

    videoList.appendChild(card);

  });

}


// ==============================
// SECURITY: ESCAPE HTML
// ==============================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


// ==============================
// START
// ==============================

loadVideos();

</script>

</body>
</html>
